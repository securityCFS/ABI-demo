<svg xmlns="http://www.w3.org/2000/svg" width="64.53" height="71.90" viewBox="137.0 73.5 968.0 1078.5" role="img" aria-labelledby="title desc">
  <title id="title">ABI bear</title>
  <desc id="desc">Coral teddy bear head with stitched forehead, shaded inner ears and a golden bow. Editable vector artwork on a transparent background.</desc>
  <defs>
    <linearGradient id="ear" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#C65D50"/>
      <stop offset="1" stop-color="#E87964"/>
    </linearGradient>
  </defs>
  <g stroke="#641D19" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ears and subtle inner-ear gradients -->
    <g fill="#EF7C68" stroke-width="42">
      <ellipse cx="424" cy="274" rx="167" ry="176" transform="rotate(-18 424 274)"/>
      <ellipse cx="910" cy="417" rx="168" ry="181" transform="rotate(22 910 417)"/>
    </g>
    <g fill="url(#ear)" stroke="none">
      <ellipse cx="420" cy="286" rx="110" ry="108" transform="rotate(-18 420 286)"/>
      <ellipse cx="906" cy="422" rx="107" ry="114" transform="rotate(22 906 422)"/>
    </g>
