    <path fill="none" stroke-width="12" stroke-dasharray="24 34" d="M475 451C579 391 692 373 790 417"/>
    <!-- Nose, embroidered mouth and button eye -->
    <g fill="#641D19" stroke="none">
      <ellipse cx="366" cy="607" rx="59" ry="40" transform="rotate(-4 366 607)"/>
      <ellipse cx="687" cy="635" rx="57" ry="59"/>
    </g>
    <path fill="none" stroke-width="20" d="M365 640L354 689M310 731L354 689L402 733"/>
