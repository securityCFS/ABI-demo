    <path fill="#EF7C68" stroke="none" d="M754 373C620 286 481 279 364 350C271 399 210 483 180 574C137 706 175 824 261 903C335 971 456 1009 566 1007C737 1001 849 915 906 799C948 706 929 592 883 500C868 470 850 447 831 429Z"/>
